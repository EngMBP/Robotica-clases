<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diagrama 3 — Componentes, ensambles y subensambles</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body {
  margin: 0;
  padding: 2rem;
  background: #f5f5f5;
  font-family: 'Geist', sans-serif;
}
.diagram-container {
  max-width: 100%;
  overflow-x: auto;
}
svg {
  display: block;
  margin: 0 auto;
}
</style>
</head>
<body>

<div class="diagram-container">
<svg viewBox="0 0 900 650" width="900" height="650" role="img" aria-labelledby="diagram-3-title diagram-3-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="diagram-3-title">Componentes, ensambles y subensambles</title>
  <desc id="diagram-3-desc">Diagrama jerárquico de abajo hacia arriba mostrando cómo piezas diseñadas (azul) y componentes comerciales (gris) se combinan en subensambles que convergen en un ensamble final.</desc>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
    </marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
    </marker>
  </defs>

  <!-- Fondo -->
  <rect width="100%" height="100%" fill="#f5f5f5"/>

  <!-- ========== NIVEL BASE: PIEZAS DISEÑADAS vs COMERCIALES ========== -->

  <!-- COLUMNA A: PIEZAS DISEÑADAS (Azul) -->
  <text x="150" y="35" font-size="11" font-family="'Geist Mono', monospace" fill="#4f5d75" letter-spacing="0.08em">DISEÑADAS</text>

  <!-- Pieza diseñada 1 -->
  <rect x="80" y="50" width="80" height="60" rx="4" fill="#2e5aa8" fill-opacity="0.08" stroke="#2e5aa8" stroke-width="1"/>
  <rect x="90" y="60" width="30" height="30" fill="none" stroke="#2e5aa8" stroke-width="1.2"/>
  <text x="120" y="95" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle" fill="#2e5aa8" font-weight="600">Pieza 1</text>

  <!-- Pieza diseñada 2 -->
  <rect x="180" y="50" width="80" height="60" rx="4" fill="#2e5aa8" fill-opacity="0.08" stroke="#2e5aa8" stroke-width="1"/>
  <circle cx="220" cy="80" r="15" fill="none" stroke="#2e5aa8" stroke-width="1.2"/>
  <text x="220" y="95" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle" fill="#2e5aa8" font-weight="600">Pieza 2</text>

  <!-- Pieza diseñada 3 -->
  <rect x="280" y="50" width="80" height="60" rx="4" fill="#2e5aa8" fill-opacity="0.08" stroke="#2e5aa8" stroke-width="1"/>
  <path d="M 310 60 L 330 70 L 310 80 Z" fill="none" stroke="#2e5aa8" stroke-width="1.2"/>
  <path d="M 330 70 L 350 70 L 340 85 Z" fill="none" stroke="#2e5aa8" stroke-width="1.2"/>
  <text x="320" y="95" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle" fill="#2e5aa8" font-weight="600">Pieza 3</text>

  <!-- COLUMNA B: COMPONENTES COMERCIALES (Gris) -->
  <text x="650" y="35" font-size="11" font-family="'Geist Mono', monospace" fill="#7a8399" letter-spacing="0.08em">COMERCIALES</text>

  <!-- Componente 1: Tornillo -->
  <rect x="570" y="50" width="80" height="60" rx="4" fill="rgba(45,49,66,0.05)" stroke="#7a8399" stroke-width="1"/>
  <circle cx="600" cy="75" r="3" fill="#7a8399"/>
  <circle cx="610" cy="75" r="3" fill="#7a8399"/>
  <circle cx="620" cy="75" r="3" fill="#7a8399"/>
  <line x1="600" y1="85" x2="620" y2="85" stroke="#7a8399" stroke-width="1"/>
  <text x="610" y="95" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle" fill="#7a8399" font-weight="600">Tornillo</text>

  <!-- Componente 2: Rodamiento -->
  <rect x="670" y="50" width="80" height="60" rx="4" fill="rgba(45,49,66,0.05)" stroke="#7a8399" stroke-width="1"/>
  <circle cx="710" cy="75" r="12" fill="none" stroke="#7a8399" stroke-width="1.2"/>
  <circle cx="710" cy="75" r="6" fill="none" stroke="#7a8399" stroke-width="0.8"/>
  <text x="710" y="95" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle" fill="#7a8399" font-weight="600">Rodamiento</text>

  <!-- ========== FLECHAS HACIA SUBENSAMBLES ========== -->

  <!-- Flechas desde piezas diseñadas al Subensamble A -->
  <path d="M 120 110 L 140 160" stroke="#2e5aa8" stroke-width="1" fill="none" marker-end="url(#arrow)"/>
  <path d="M 220 110 L 200 160" stroke="#2e5aa8" stroke-width="1" fill="none" marker-end="url(#arrow)"/>

  <!-- Flechas desde componentes comerciales al Subensamble A -->
  <path d="M 610 110 L 210 160" stroke="#7a8399" stroke-width="1" fill="none" marker-end="url(#arrow)"/>

  <!-- Flechas desde piezas diseñadas al Subensamble B -->
  <path d="M 320 110 L 540 160" stroke="#2e5aa8" stroke-width="1" fill="none" marker-end="url(#arrow)"/>

  <!-- Flechas desde componentes comerciales al Subensamble B -->
  <path d="M 710 110 L 580 160" stroke="#7a8399" stroke-width="1" fill="none" marker-end="url(#arrow)"/>

  <!-- ========== NIVEL 2: SUBENSAMBLES ========== -->

  <!-- SUBENSAMBLE A -->
  <rect x="120" y="160" width="180" height="100" rx="6" fill="white" stroke="#2e5aa8" stroke-width="1.5"/>
  <rect x="130" y="170" width="160" height="20" fill="#2e5aa8" fill-opacity="0.10" rx="3"/>
  <text x="210" y="185" font-size="11" font-family="'Geist Mono', monospace" fill="#2e5aa8" letter-spacing="0.06em" text-anchor="middle">SUBENSAMBLE A</text>

  <text x="160" y="215" font-size="9" font-family="'Geist', sans-serif" fill="#4f5d75">• Pieza 1 + Pieza 2</text>
  <text x="160" y="232" font-size="9" font-family="'Geist', sans-serif" fill="#4f5d75">• Tornillo (x2)</text>
  <text x="160" y="249" font-size="9" font-family="'Geist', sans-serif" fill="#4f5d75">Sub-función A</text>

  <!-- SUBENSAMBLE B -->
  <rect x="520" y="160" width="180" height="100" rx="6" fill="white" stroke="#2e5aa8" stroke-width="1.5"/>
  <rect x="530" y="170" width="160" height="20" fill="#2e5aa8" fill-opacity="0.10" rx="3"/>
  <text x="610" y="185" font-size="11" font-family="'Geist Mono', monospace" fill="#2e5aa8" letter-spacing="0.06em" text-anchor="middle">SUBENSAMBLE B</text>

  <text x="560" y="215" font-size="9" font-family="'Geist', sans-serif" fill="#4f5d75">• Pieza 3</text>
  <text x="560" y="232" font-size="9" font-family="'Geist', sans-serif" fill="#4f5d75">• Rodamiento</text>
  <text x="560" y="249" font-size="9" font-family="'Geist', sans-serif" fill="#4f5d75">Sub-función B</text>

  <!-- ========== FLECHAS HACIA ENSAMBLE FINAL ========== -->

  <path d="M 210 260 L 350 330" stroke="#2e5aa8" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M 610 260 L 450 330" stroke="#2e5aa8" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <!-- ========== NIVEL 3: ENSAMBLE FINAL ========== -->

  <rect x="300" y="330" width="260" height="120" rx="6" fill="#eb6c36" fill-opacity="0.08" stroke="#eb6c36" stroke-width="2"/>
  <rect x="310" y="340" width="240" height="30" fill="#eb6c36" fill-opacity="0.15" rx="3"/>

  <text x="430" y="360" font-size="14" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle" fill="#eb6c36" letter-spacing="0.04em">
    ENSAMBLE FINAL
  </text>
  <text x="430" y="376" font-size="11" font-family="'Geist Mono', monospace" fill="#eb6c36" text-anchor="middle" letter-spacing="0.06em">
    (Producto completo)
  </text>

  <text x="430" y="410" font-size="10" font-family="'Geist', sans-serif" fill="#4f5d75" text-anchor="middle">
    Subensamble A + Subensamble B
  </text>
  <text x="430" y="430" font-size="10" font-family="'Geist', sans-serif" fill="#4f5d75" text-anchor="middle">
    + Componentes comerciales adicionales
  </text>

  <!-- ========== LEYENDA ========== -->

  <line x1="30" y1="510" x2="870" y2="510" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>

  <text x="30" y="540" font-size="10" font-family="'Geist', sans-serif" fill="#2d3142" font-weight="600">Codificación por tipo</text>

  <!-- Legend item 1: Diseñadas -->
  <rect x="30" y="550" width="16" height="16" rx="3" fill="#2e5aa8" fill-opacity="0.08" stroke="#2e5aa8" stroke-width="1"/>
  <text x="55" y="562" font-size="9" font-family="'Geist', sans-serif" fill="#2e5aa8">Piezas diseñadas a medida</text>

  <!-- Legend item 2: Comerciales -->
  <rect x="350" y="550" width="16" height="16" rx="3" fill="rgba(45,49,66,0.05)" stroke="#7a8399" stroke-width="1"/>
  <text x="375" y="562" font-size="9" font-family="'Geist', sans-serif" fill="#7a8399">Componentes comerciales (off-the-shelf)</text>

  <!-- Legend item 3: Focal -->
  <rect x="680" y="550" width="16" height="16" rx="3" fill="#eb6c36" fill-opacity="0.08" stroke="#eb6c36" stroke-width="2"/>
  <text x="705" y="562" font-size="9" font-family="'Geist', sans-serif" fill="#eb6c36">Ensamble final del producto</text>

  <text x="30" y="600" font-size="9" font-family="'Geist', sans-serif" fill="#4f5d75">
    La jerarquía fluye de abajo hacia arriba: las piezas se combinan en subensambles funcionales, que convergen en el ensamble final.
  </text>

</svg>
</div>

</body>
</html>
